        .container { max-width: 600px; width: 100%; box-sizing: border-box; }
        
        .logo-container { text-align: center; margin-bottom: 10px; width: 100%; }
        .logo-container img { max-width: 180px; width: 100%; height: auto; object-fit: containment; }
        
        h1, h2 { text-align: center; color: var(--primary); margin-bottom: 5px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); margin-bottom: 20px; box-sizing: border-box; }
        button { background: var(--primary); color: var(--bg); font-weight: bold; cursor: pointer; font-size: 16px; border: none; padding: 12px; border-radius: 6px; width: 100%; }
        button:hover { opacity: 0.9; }
        .hidden { display: none !important; }
        
        #loading-screen { text-align: center; padding: 40px 20px; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 42px; height: 42px; border-radius: 50%; border-left-color: var(--primary); animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        img.emoji { height: 1.2em; width: 1.2em; margin: 0 .15em; vertical-align: -0.2em; }
        
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 1000px; }
        th, td { padding: 12px 8px; text-align: center; border-bottom: 1px solid #2a3558; font-size: 12px; }
        th { color: var(--primary); background: #1a2238; font-weight: 600; vertical-align: middle; }
        .th-match-header { font-size: 12px; font-weight: bold; color: white; white-space: nowrap; min-width: 120px; text-align: center; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: center; gap: 4px; }
        
        .cell-exact { background-color: #028a5a !important; color: white !important; font-weight: bold; } 
        .cell-trend { background-color: #b8860b !important; color: white !important; font-weight: bold; } 
        .cell-miss { background-color: #8b0000 !important; color: #ffcccc !important; } 

        .leaderboard-table { min-width: 100% !important; }
        .leaderboard-table th, .leaderboard-table td { padding: 10px; font-size: 14px; }
        .leaderboard-row:nth-child(1) { background: rgba(255, 215, 0, 0.15); } 
        .rank-badge { font-weight: bold; display: inline-block; width: 24px; height: 24px; line-height: 24px; border-radius: 50%; background: #2a3558; color: white; text-align: center; font-size: 12px; }
        .leaderboard-row:nth-child(1) .rank-badge { background: #ffd700; color: #131927; }
        .leaderboard-row:nth-child(2) .rank-badge { background: #c0c0c0; color: #131927; }
        .leaderboard-row:nth-child(3) .rank-badge { background: #cd7f32; color: #131927; }
        .stats-span { font-size: 11px; color: #8a99ad; margin-left: 5px; font-weight: normal; }

        .table-filter-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .filter-btn { flex: 1; background: #2a3558; color: #a0aec0; border: 2px solid transparent; padding: 10px; font-size: 13px; margin: 0; }
        .filter-btn.active { background: #1e2640; color: var(--primary); border-color: var(--primary); }

        /* STYLE DLA PODIUM */
        .podium-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin: 20px 0 10px 0;
            padding: 15px 10px;
            background: #1a2238;
            border-radius: 12px;
            height: 210px;
            box-sizing: border-box;
        }
        .podium-place {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 33%;
            text-align: center;
        }
        .podium-user {
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
        .podium-pts {
            font-size: 12px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 2px;
        }
        .podium-stats {
            font-size: 10px;
            color: #8a99ad;
            margin-bottom: 6px;
            white-space: nowrap;
        }
        .podium-block {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #131927;
            border-radius: 6px 6px 0 0;

        .place-3 { order: 3; height: 50px; background: linear-gradient(135deg, #cd7f32, #8b4513); font-size: 18px; margin-left: 2%; }

        @media (min-width: 500px) {

            .podium-user { font-size: 14px; }
        }
    </style>
</head>

    function getFlagAnd3LetterCode(teamName) {
        if (!teamName) return "???";
        const flag = teamFlags[teamName] || "";
        return `${flag} ${teamName.substring(0, 3).toUpperCase()}`;
    }

    function refreshTwemoji() {
        if (window.twemoji) {
            twemoji.parse(document.body, { folder: 'svg', ext: '.svg' });
        }
    }

    async function initApp() {
        document.getElementById('loading-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        await loadAllScores();
    }

    window.onload = initApp;

    function setTableFilter(filterValue) {
        currentTableFilter = filterValue;
        document.getElementById('filter-btn-pucharowa').classList.remove('active');
        document.getElementById('filter-btn-grupowa').classList.remove('active');
        
        if (filterValue === 'pucharowa') {
            document.getElementById('filter-btn-pucharowa').classList.add('active');
        } else {
            document.getElementById('filter-btn-grupowa').classList.add('active');
        }
        
        buildGlobalTableUI();
    }

    function evaluatePrediction(playerPrediction, officialResult, matchGroup) {
        if (!officialResult || officialResult === "" || !playerPrediction || playerPrediction === "-" || !playerPrediction.includes(":")) {
            return { points: 0, cssClass: "", type: "none" };
        }

        let exactPoints = 45;
        let trendPoints = 30;

        switch (matchGroup) {
            case "1/16": exactPoints = 90; trendPoints = 60; break;
            case "1/8": exactPoints = 135; trendPoints = 90; break;
            case "1/4": exactPoints = 180; trendPoints = 120; break;
            case "1/2": exactPoints = 225; trendPoints = 150; break;
            case "FINALE": exactPoints = 270; trendPoints = 180; break;
            default: exactPoints = 45; trendPoints = 30; break;
        }

        if (playerPrediction.trim() === officialResult.trim()) {
            return { points: exactPoints, cssClass: "cell-exact", type: "exact" };
        }
        const [pHome, pAway] = playerPrediction.split(":").map(Number);
        const [oHome, oAway] = officialResult.split(":").map(Number);
        const playerTrend = pHome > pAway ? 1 : (pHome < pAway ? -1 : 0);
        const officialTrend = oHome > oAway ? 1 : (oHome < oAway ? -1 : 0);
        if (playerTrend === officialTrend) {
            return { points: trendPoints, cssClass: "cell-trend", type: "trend" };
        }
        return { points: 0, cssClass: "cell-miss", type: "miss" };
    }

    function evaluateScorersPoints(playerName) {
        if (!playerName || playerName === "" || playerName === "-") return 0;
        const playerObj = playersDatabase.find(p => p.name === playerName);
        if (!playerObj) return 0;
        
        const goalsScored = officialScorersResults[playerName] || 0;
        return goalsScored * playerObj.points;
    }

    async function loadAllScores() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            existingDatabaseRows = data[KEY_NAME] || [];
            buildGlobalTableUI();
        } catch (e) {
            console.error("Błąd pobierania danych:", e);
        }
    }

    function buildGlobalTableUI() {
        const thead = document.getElementById('table-head');
        const tbody = document.getElementById('table-body');
        const leaderboardBody = document.getElementById('leaderboard-body');
        const loggedInUser = localStorage.getItem('typerNick') || "";
        
        let filteredMatches = [];
        if (currentTableFilter === "grupowa") {
            filteredMatches = allMatches.filter(m => !["1/16", "1/8", "1/4", "1/2", "FINALE"].includes(m.group));
        } else {
            filteredMatches = allMatches.filter(m => ["1/16", "1/8", "1/4", "1/2", "FINALE"].includes(m.group));
        }

        thead.innerHTML = "";
        const trHead = document.createElement('tr');
        trHead.innerHTML = "<th style='position:sticky; left:0; background:#1a2238; z-index:3;'>Gracz</th>";
        
        filteredMatches.forEach(m => {
            const homeFormat = getFlagAnd3LetterCode(m.t1);
            const awayFormat = getFlagAnd3LetterCode(m.t2);
            const resultSub = m.score ? `<br><span style="color:#01c38d; font-size:10px;">(${m.score})</span>` : '';
            
            trHead.innerHTML += `
                <th>
                    <div class="th-match-header" style="flex-direction:column; padding: 4px 0;">
                        <div>${homeFormat} - ${awayFormat}</div>
                        ${resultSub}
                    </div>
                </th>`;
        });

        if (currentTableFilter === "pucharowa") {
            for(let i = 1; i <= 4; i++) {
                trHead.innerHTML += `<th><div class="th-match-header">⚽ Strzelec #${i}</div></th>`;
            }
        }

        thead.appendChild(trHead);

        let playersLeaderboard = [];
        tbody.innerHTML = "";

        if (!Array.isArray(existingDatabaseRows) || existingDatabaseRows.length === 0) {
            tbody.innerHTML = "<tr><td colspan='100'>Brak wpisów w bazie danych.</td></tr>";
            leaderboardBody.innerHTML = "<tr><td colspan='3'>Brak danych do rankingu.</td></tr>";
            return;
        }

        const loggedInUserRow = existingDatabaseRows.find(r => r.gracz && r.gracz.toLowerCase() === loggedInUser.toLowerCase());

        existingDatabaseRows.forEach(row => {
            if (!row.gracz) return;
            let totalPoints = 0, countExact = 0, countTrend = 0;
            const tr = document.createElement('tr');
            let rowHtml = `<td style="font-weight:bold; color:#01c38d; position:sticky; left:0; background:#131927; z-index:1;">${row.gracz}</td>`;
            
            allMatches.forEach(m => {
                const matchKey = m.id.toLowerCase();
                const playerPrediction = row[matchKey] || '-';
                const evaluation = evaluatePrediction(playerPrediction, m.score, m.group);
                totalPoints += evaluation.points;
                if (evaluation.type === "exact") countExact++;
                if (evaluation.type === "trend") countTrend++;
            });

            for(let i = 1; i <= 4; i++) {
                const scorerSelected = row[`scorer${i}`] || "";
                totalPoints += evaluateScorersPoints(scorerSelected);
            }

            filteredMatches.forEach(m => {
                const matchKey = m.id.toLowerCase();
                const playerPrediction = row[matchKey] || '-';
                const evaluation = evaluatePrediction(playerPrediction, m.score, m.group);

                let cellTextToShow = playerPrediction;
                let finalCssClass = evaluation.cssClass;

                if (row.gracz.toLowerCase() !== loggedInUser.toLowerCase()) {
                    const now = new Date();
                    const lockTime = new Date("2026-07-18T23:00:00");
                    const isFinaleMatch = m.group === "FINALE";

                    let isHidden = false;
                    if (isFinaleMatch) {
                        const hasLoggedInUserPredictedFinale = loggedInUserRow && loggedInUserRow["mecz103"] && loggedInUserRow["mecz104"];
                        if (now < lockTime && !hasLoggedInUserPredictedFinale) {
                            isHidden = true;
                        }
                    } else {
                        const loggedInUserPrediction = loggedInUserRow ? loggedInUserRow[matchKey] : "";
                        const hasLoggedInUserPredicted = loggedInUserPrediction && loggedInUserPrediction.includes(":");
                        if (!hasLoggedInUserPredicted) {
                            isHidden = true;
                        }
                    }

                    if (isHidden) {
                        cellTextToShow = "🔒 Ukryte";
                        finalCssClass = "";
                    }
                }

                rowHtml += `<td class="${finalCssClass}">${cellTextToShow}</td>`;
            });

            if (currentTableFilter === "pucharowa") {
                const now = new Date();
                const lockTime = new Date("2026-07-18T23:00:00");
                const hasLoggedInUserPredictedFinale = loggedInUserRow && loggedInUserRow["mecz103"] && loggedInUserRow["mecz104"];

                for(let i = 1; i <= 4; i++) {
                    let scorerText = row[`scorer${i}`] || "-";
                    let scorerCss = "";

                    if (scorerText !== "-" && scorerText !== "") {
                        const scorerGols = officialScorersResults[scorerText] || 0;
                        if (scorerGols > 0) {
                            scorerCss = "cell-exact";
                            scorerText += ` (${scorerGols} ⚽)`;
                        }
                    }

                    if (row.gracz.toLowerCase() !== loggedInUser.toLowerCase() && now < lockTime && !hasLoggedInUserPredictedFinale) {
                        scorerText = "🔒 Ukryte";
                        scorerCss = "";
                    }

                    rowHtml += `<td class="${scorerCss}">${scorerText}</td>`;
                }
            }
            
            tr.innerHTML = rowHtml;
            tbody.appendChild(tr);
            playersLeaderboard.push({ name: row.gracz, points: totalPoints, exacts: countExact, trends: countTrend });
        });

        playersLeaderboard.sort((a, b) => b.points !== a.points ? b.points - a.points : b.exacts - a.exacts);
        
        // Aktualizacja dynamicznego podium na samej górze z uwzględnieniem 🟢 i 🟡 krotek
        if(playersLeaderboard.length >= 1) {
            document.getElementById('p1-nick').innerText = playersLeaderboard[0].name;
            document.getElementById('p1-pts').innerText = playersLeaderboard[0].points + " pkt";
            document.getElementById('p1-stats').innerText = `🟢 x${playersLeaderboard[0].exacts}  🟡 x${playersLeaderboard[0].trends}`;
        }
        if(playersLeaderboard.length >= 2) {
            document.getElementById('p2-nick').innerText = playersLeaderboard[1].name;
            document.getElementById('p2-pts').innerText = playersLeaderboard[1].points + " pkt";
            document.getElementById('p2-stats').innerText = `🟢 x${playersLeaderboard[1].exacts}  🟡 x${playersLeaderboard[1].trends}`;
        } else {
            document.getElementById('p2-nick').innerText = "-";
            document.getElementById('p2-pts').innerText = "0 pkt";
            document.getElementById('p2-stats').innerText = "🟢 x0  🟡 x0";
        }
        if(playersLeaderboard.length >= 3) {
            document.getElementById('p3-nick').innerText = playersLeaderboard[2].name;
            document.getElementById('p3-pts').innerText = playersLeaderboard[2].points + " pkt";
            document.getElementById('p3-stats').innerText = `🟢 x${playersLeaderboard[2].exacts}  🟡 x${playersLeaderboard[2].trends}`;
        } else {
            document.getElementById('p3-nick').innerText = "-";
            document.getElementById('p3-pts').innerText = "0 pkt";
            document.getElementById('p3-stats').innerText = "🟢 x0  🟡 x0";
        }

        leaderboardBody.innerHTML = "";
        playersLeaderboard.forEach((player, index) => {
            const trRank = document.createElement('tr');
            trRank.className = "leaderboard-row";
            trRank.innerHTML = `
                <td><span class="rank-badge">${index + 1}</span></td>
                <td style="text-align: left; padding-left: 15px; font-weight: bold; color: #fff;">
                    ${player.name} <span class="stats-span">(🟢 x${player.exacts}, 🟡 x${player.trends})</span>
                </td>
                <td style="font-weight: bold; color: var(--primary); font-size: 16px;">${player.points} pkt</td>
            `;
            leaderboardBody.appendChild(trRank);
        });
        refreshTwemoji(); 
    }
